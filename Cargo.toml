[workspace]
members = [
    "crates/nyx-core",
    "crates/nyx-pal",
    "crates/nyx-tui",
]
resolver = "2"

[workspace.dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
cookie_store = "0.22"
crossterm = "0.27"
html5ever = "0.26"
httpdate = "1"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ratatui = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "socks"] }
rpassword = "7"
scraper = "0.18"
serde_json = "1"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
url = "2"
zeroize = "1"
windows-sys = { version = "0.61", features = [
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
